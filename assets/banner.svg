<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Background & Accent Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <radialGradient id="emberGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ff1a00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b00"/>
      <stop offset="50%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b00" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#ff7700" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff3b00" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Tactical Overlay Patterns -->
    <pattern id="hexGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 20 5 L 20 15 L 10 20 L 0 15 L 0 5 Z" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ff5500" fill-opacity="0.08"/>
    </pattern>

    <!-- Filters for Glows -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="orangeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="1.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rectangles & Backgrounds -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>
  <rect width="800" height="200" fill="url(#emberGlow)"/>
  <rect width="800" height="200" fill="url(#hexGrid)"/>
  <rect width="800" height="200" fill="url(#dotGrid)"/>

  <!-- Tactical Grid Lines & Diagonal Stripes -->
  <line x1="0" y1="40" x2="800" y2="40" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 0 0 L 35 0 L 0 35 Z" fill="#ff3b00" opacity="0.85"/>
  <path d="M 0 165 L 35 200 L 0 200 Z" fill="#ff3b00" opacity="0.85"/>
  <path d="M 765 0 L 800 0 L 800 35 Z" fill="#ff3b00" opacity="0.85"/>
  <path d="M 800 165 L 800 200 L 765 200 Z" fill="#ff3b00" opacity="0.85"/>

  <!-- Outer Frame & Corner HUD Markers -->
  <rect x="1.5" y="1.5" width="797" height="197" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
  
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#ff4500" stroke-width="2.5"/>
  <path d="M 788 28 L 788 12 L 772 12" fill="none" stroke="#ff4500" stroke-width="2.5"/>
  <path d="M 12 172 L 12 188 L 28 188" fill="none" stroke="#ff4500" stroke-width="2.5"/>
  <path d="M 788 172 L 788 188 L 772 188" fill="none" stroke="#ff4500" stroke-width="2.5"/>

  <!-- Graphic Emblem / Right HUD Element -->
  <g transform="translate(560, 20)">
    <!-- Radar/Targeting Circles -->
    <circle cx="100" cy="80" r="68" fill="none" stroke="#ff4500" stroke-dasharray="4 8" stroke-width="1.5" opacity="0.25"/>
    <circle cx="100" cy="80" r="52" fill="none" stroke="#ff8800" stroke-dasharray="14 5" stroke-width="1.5" opacity="0.45"/>
    <circle cx="100" cy="80" r="36" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
    
    <!-- Stylized Armored Shield & Tank Turret Geometry -->
    <path d="M 100 32 L 138 54 L 138 106 L 100 128 L 62 106 L 62 54 Z" fill="#131722" stroke="url(#orangeGrad)" stroke-width="2" filter="url(#orangeGlow)"/>
    <path d="M 78 68 L 122 68 L 128 92 L 72 92 Z" fill="url(#orangeGrad)" opacity="0.85"/>
    <path d="M 96 46 L 104 46 L 104 70 L 96 70 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="100" cy="80" r="6" fill="#ff3b00" filter="url(#softGlow)"/>

    <!-- Crosshair Lines -->
    <line x1="15" y1="80" x2="48" y2="80" stroke="#ff5500" stroke-width="1.5" opacity="0.6"/>
    <line x1="152" y1="80" x2="185" y2="80" stroke="#ff5500" stroke-width="1.5" opacity="0.6"/>
    <line x1="100" y1="-5" x2="100" y2="22" stroke="#ff5500" stroke-width="1.5" opacity="0.6"/>
    <line x1="100" y1="138" x2="100" y2="165" stroke="#ff5500" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Left Content Section -->
  <!-- Release Tag Badge -->
  <g transform="translate(50, 38)">
    <rect x="0" y="0" width="138" height="22" rx="4" fill="#ff3b00" fill-opacity="0.18" stroke="#ff3b00" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="12" cy="11" r="3.5" fill="#ff4500" filter="url(#softGlow)"/>
    <text x="24" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ff9900" letter-spacing="1.5">PROTOCOL v8.0</text>
  </g>

  <!-- Main Title: WoT Grinder Bot -->
  <text x="50" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="0.5">
    WoT Grinder Bot
  </text>

  <!-- Accent Glow Line -->
  <rect x="50" y="117" width="430" height="2" fill="url(#orangeGrad)"/>
  <rect x="50" y="117" width="140" height="2" fill="#ffffff" filter="url(#softGlow)"/>

  <!-- Subtitle: BigWorld Protocol Client -->
  <text x="50" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="16" font-weight="700" fill="#ff9900" letter-spacing="3.5" filter="url(#softGlow)">
    BIGWORLD PROTOCOL CLIENT
  </text>

  <!-- Feature Indicators at Bottom -->
  <g transform="translate(50, 170)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
    <text x="0" y="0">⚡ Cuckoo-Cycle Solved</text>
    <text x="160" y="0">🔒 RSA Handshake</text>
    <text x="300" y="0">🎮 Headless Bot Core</text>
  </g>
</svg>
