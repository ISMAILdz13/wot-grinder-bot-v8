<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <linearGradient id="cardOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>

    <linearGradient id="cardActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#111d2b"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b00"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7700"/>
    </marker>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>

    <!-- Pattern Overlay -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <rect width="800" height="400" fill="url(#grid)"/>

  <!-- Diagram Title Header -->
  <text x="40" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    BigWorld Protocol — Authentication Flow
  </text>
  <text x="40" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#ff9900" letter-spacing="1.5">
    WOT GRINDER BOT LOGIN PIPELINE
  </text>

  <!-- ==================== PHASE 1 CONTAINER ==================== -->
  <rect x="25" y="70" width="750" height="135" rx="10" fill="#0d111a" stroke="#232d3f" stroke-width="1.5"/>
  <rect x="40" y="60" width="220" height="20" rx="4" fill="#ff3b00" fill-opacity="0.2" stroke="#ff3b00" stroke-opacity="0.5" stroke-width="1"/>
  <text x="50" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ff9900" letter-spacing="1">
    PHASE I: HANDSHAKE &amp; PROOF-OF-WORK
  </text>

  <!-- Step 1: PING -->
  <g transform="translate(45, 100)">
    <rect width="130" height="85" rx="8" fill="url(#cardOrange)" stroke="#ff4500" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="8" y="8" width="22" height="18" rx="4" fill="#ff4500" fill-opacity="0.3"/>
    <text x="19" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="800" fill="#ff9900">01</text>
    <text x="65" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">PING</text>
    <text x="65" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">UDP Probe</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 175 142.5 L 220 142.5" fill="none" stroke="#ff7700" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Step 2: LoginRequest -->
  <g transform="translate(225, 100)">
    <rect width="140" height="85" rx="8" fill="url(#cardOrange)" stroke="#ff4500" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="8" y="8" width="22" height="18" rx="4" fill="#ff4500" fill-opacity="0.3"/>
    <text x="19" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="800" fill="#ff9900">02</text>
    <text x="70" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff">LoginRequest</text>
    <text x="70" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Client &amp; Auth Info</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 365 142.5 L 410 142.5" fill="none" stroke="#ff7700" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Step 3: Cuckoo Challenge -->
  <g transform="translate(415, 100)">
    <rect width="150" height="85" rx="8" fill="url(#cardOrange)" stroke="#ff9900" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="8" y="8" width="22" height="18" rx="4" fill="#ff9900" fill-opacity="0.3"/>
    <text x="19" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="800" fill="#ffaa00">03</text>
    <text x="75" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Cuckoo</text>
    <text x="75" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffaa00">Challenge</text>
    <text x="75" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Server Nonce Matrix</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 565 142.5 L 610 142.5" fill="none" stroke="#ff7700" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Step 4: ChallengeResponse -->
  <g transform="translate(615, 100)">
    <rect width="145" height="85" rx="8" fill="url(#cardOrange)" stroke="#ff4500" stroke-width="2" filter="url(#softGlow)"/>
    <rect x="8" y="8" width="22" height="18" rx="4" fill="#ff4500" fill-opacity="0.4"/>
    <text x="19" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="800" fill="#ffffff">04</text>
    <text x="72.5" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Challenge</text>
    <text x="72.5" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffaa00">Response</text>
    <text x="72.5" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Fast C-Solver Proof</text>
  </g>


  <!-- ==================== TRANSITION CONNECTOR ==================== -->
  <path d="M 687.5 185 L 687.5 212 Q 687.5 222 677.5 222 L 135 222 Q 125 222 125 232 L 125 242" fill="none" stroke="#ff7700" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-orange)"/>
  
  <rect x="330" y="213" width="140" height="18" rx="4" fill="#181d28" stroke="#ff7700" stroke-width="1"/>
  <text x="400" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#ffaa00">Cuckoo Graph Proof Accepted</text>


  <!-- ==================== PHASE 2 CONTAINER ==================== -->
  <rect x="25" y="235" width="750" height="120" rx="10" fill="#0d111a" stroke="#232d3f" stroke-width="1.5"/>
  <rect x="40" y="225" width="220" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
  <text x="50" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" letter-spacing="1">
    PHASE II: ENCRYPTED AUTH &amp; SESSION
  </text>

  <!-- Step 5: RSA Login -->
  <g transform="translate(45, 255)">
    <rect width="160" height="85" rx="8" fill="url(#cardActive)" stroke="#0ea5e9" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="8" y="8" width="22" height="18" rx="4" fill="#0ea5e9" fill-opacity="0.3"/>
    <text x="19" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="800" fill="#38bdf8">05</text>
    <text x="80" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">RSA Login</text>
    <text x="80" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Encrypted Payload</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 205 297.5 L 280 297.5" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 6: LoginSuccess -->
  <g transform="translate(280, 255)">
    <rect width="170" height="85" rx="8" fill="url(#cardActive)" stroke="#10b981" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="8" y="8" width="22" height="18" rx="4" fill="#10b981" fill-opacity="0.3"/>
    <text x="19" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="800" fill="#34d399">06</text>
    <text x="85" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff">LoginSuccess</text>
    <text x="85" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Session Ticket &amp; Keys</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M 450 297.5 L 525 297.5" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 7: Base App -->
  <g transform="translate(525, 255)">
    <rect width="235" height="85" rx="8" fill="url(#cardActive)" stroke="#10b981" stroke-width="2" filter="url(#softGlow)"/>
    <rect x="8" y="8" width="22" height="18" rx="4" fill="#10b981" fill-opacity="0.4"/>
    <text x="19" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="800" fill="#ffffff">07</text>
    <text x="117.5" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#34d399">Base App</text>
    <text x="117.5" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Active Main Loop / Grinding State</text>
  </g>

  <!-- ==================== FOOTER / LEGEND ==================== -->
  <g transform="translate(40, 380)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">
    <text x="0" y="0">🔸 UDP/TCP Protocol</text>
    <text x="160" y="0">⚡ Cuckoo Solver (C-Extension)</text>
    <text x="380" y="0">🔒 2048-bit RSA Encryption</text>
    <text x="590" y="0">🟢 Online Game Client</text>
  </g>
</svg>
